<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVE List — andrd3v</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1rem;
      color: #1a1a1a;
      background: #fafafa;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-bottom: 2rem;
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back:hover { color: #1a1a1a; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 2.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead th {
      text-align: left;
      font-weight: 600;
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.5rem 0.75rem;
      border-bottom: 2px solid #e0e0e0;
    }

    tbody td {
      padding: 0.75rem;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }

    tbody tr:hover { background: #f5f5f5; }

    .cve-id {
      font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .cve-id a {
      color: #1a1a1a;
      text-decoration: none;
    }

    .cve-id a:hover { text-decoration: underline; }

    .component {
      font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      background: #f0f0f0;
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }

    .platforms {
      font-size: 0.8rem;
      color: #666;
    }

    .platforms a {
      color: #666;
      text-decoration: none;
      border-bottom: 1px dotted #aaa;
    }

    .platforms a:hover {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #999;
    }

    @media (max-width: 600px) {
      body { padding: 1.5rem 0.75rem; }
      h1 { font-size: 1.3rem; }
      table { font-size: 0.85rem; }
      thead th { font-size: 0.7rem; padding: 0.4rem 0.5rem; }
      tbody td { padding: 0.6rem 0.5rem; }
      .cve-id { font-size: 0.8rem; }
      .component { font-size: 0.8rem; }
      .platforms { font-size: 0.75rem; }
    }

    @media (max-width: 380px) {
      body { padding: 1rem 0.5rem; }
      h1 { font-size: 1.15rem; }
    }

    @media (min-width: 1400px) {
      body { max-width: 820px; font-size: 1.05rem; }
    }

    @media (min-width: 2000px) {
      body { max-width: 920px; font-size: 1.1rem; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <a href="../" class="back">&larr; andrd3v</a>

  <h1>CVE List</h1>
  <p class="subtitle">Vulnerabilities reported to Apple and assigned a CVE.</p>

  <table>
    <thead>
      <tr>
        <th>CVE</th>
        <th>Component</th>
        <th>Impact</th>
        <th>Platforms</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="cve-id"><a href="../first-cve/">CVE-2026-28882</a></td>
        <td><span class="component">libxpc</span></td>
        <td>An app may be able to enumerate a user's installed apps and running processes</td>
        <td class="platforms">
          <a href="https://support.apple.com/126792" target="_blank" rel="noopener">iOS</a>,
          <a href="https://support.apple.com/126792" target="_blank" rel="noopener">iPadOS</a>,
          <a href="https://support.apple.com/126794" target="_blank" rel="noopener">macOS</a>,
          <a href="https://support.apple.com/126798" target="_blank" rel="noopener">watchOS</a>,
          <a href="https://support.apple.com/126797" target="_blank" rel="noopener">tvOS</a>,
          <a href="https://support.apple.com/126799" target="_blank" rel="noopener">visionOS</a>
        </td>
      </tr>
    </tbody>
  </table>

  <footer>
    &copy; andrd3v
  </footer>
</body>
</html>
